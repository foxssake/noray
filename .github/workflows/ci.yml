name: CI

env:
  node-version: 24.x

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: oven-sh/setup-bun@v2
    - run: bun install
    - name: Lint
      run: bun lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
    - uses: oven-sh/setup-bun@v2
    - run: bun install
    - name: Test
      run: bun test:spec
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: false # Disabled until morale improves
    steps:
    - uses: actions/checkout@v7
    - uses: oven-sh/setup-bun@v2
    - run: bun install
    - name: End to end tests
      run: bun test:e2e
